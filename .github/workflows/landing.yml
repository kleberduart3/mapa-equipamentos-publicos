# Publica a landing page (pasta landing/) no GitHub Pages, em equicidade.com.br.
# Só a landing é publicada aqui: a ferramenta (com login e dados) roda no servidor,
# em mapa.equicidade.com.br.
name: Publicar landing

on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/landing.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deploy
        uses: actions/deploy-pages@v4
