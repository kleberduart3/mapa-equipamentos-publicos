# Testes e build da imagem Docker a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes (sem os dados reais dos municípios)
        run: python -m pytest -q -m "not lento"

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t mapa:ci .
      - name: Sobe o container como em produção (somente leitura, /tmp em memória) e confere
        run: |
          docker volume create banco_ci
          docker run -d --name mapa -p 8000:8000 --read-only --tmpfs /tmp:size=1g -e HOME=/tmp \
            -v banco_ci:/var/lib/mapa --security-opt no-new-privileges:true \
            -e MAPA_AMBIENTE=producao -e MAPA_URL_BASE=https://exemplo.gov.br -e MAPA_COOKIE_SEGURO=true \
            -e MAPA_AQUECER_AO_INICIAR=false mapa:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/saude && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/saude
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/municipios)" = 401
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/)" = "http://127.0.0.1:8000/entrar"
          docker exec mapa python -m backend.app.acesso.cli criar-admin ci@exemplo.gov.br "CI" | grep -q "definir-senha#"
          docker exec mapa python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(args=['--disable-dev-shm-usage'])
              pg = b.new_page(); pg.set_content('<h1>Relatório de teste</h1>' + '<p>texto</p>' * 2000)
              pg.pdf(path='/tmp/t.pdf', format='A4'); b.close()
          import os; assert os.path.getsize('/tmp/t.pdf') > 1000; print('pdf ok')"
      - name: Confere o Caddyfile
        run: |
          docker run --rm -e MAPA_DOMINIO=exemplo.gov.br -e MAPA_EMAIL_CERTIFICADO=ti@exemplo.gov.br \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - if: failure()
        run: docker logs mapa || true
