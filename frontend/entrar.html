<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar · Equicidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#0D1450">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <main class="pagina-login">
    <div class="cartao">
      <div class="marca">
        <img class="logo" src="img/equicidade-horizontal.svg" alt="Equicidade" width="141" height="32">
      </div>

      <form id="form-entrar" novalidate>
        <h1>Entrar</h1>
        <label class="campo-rot">E-mail<input type="email" id="email" autocomplete="username" required maxlength="254"></label>
        <label class="campo-rot">Senha<input type="password" id="senha" autocomplete="current-password" required maxlength="256"></label>
        <p class="erro" id="erro" role="alert" aria-live="assertive"></p>
        <button class="btn" type="submit" id="btn-entrar">Entrar</button>
        <a href="#" class="link-sec" id="lnk-esqueci">Esqueci a senha</a>
      </form>

      <form id="form-esqueci" hidden novalidate>
        <h1>Esqueci a senha</h1>
        <p class="nota">Informe o e-mail da sua conta.</p>
        <label class="campo-rot">E-mail<input type="email" id="email-esqueci" autocomplete="username" required maxlength="254"></label>
        <p class="ok" id="msg-esqueci" aria-live="polite"></p>
        <button class="btn" type="submit">Enviar</button>
        <a href="#" class="link-sec" id="lnk-voltar">Voltar</a>
      </form>
    </div>
  </main>
  <script src="js/entrar.js"></script>
</body>
</html>
